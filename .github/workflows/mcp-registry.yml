name: Publish to MCP Registry

# Publishes mcp/server.json to the official MCP Registry. Run it after the
# matching garmin-connect-personal-api-mcp version is live on npm, because the
# registry checks that package's mcpName.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  MCP_PUBLISHER_VERSION: v1.8.2

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Check that server.json matches the npm package version
        run: |
          expected=$(node -p "require('./package.json').version")
          actual=$(node -p "require('./server.json').version")
          if [ "$actual" != "$expected" ]; then
            echo "server.json version $actual does not match package.json version $expected" >&2
            exit 1
          fi
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
